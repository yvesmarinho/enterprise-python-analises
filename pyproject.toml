[project]
name = "enterprise-python-analysis"
version = "0.2.0"
description = "Enterprise Python Analysis — N8N Performance Analyzer (ANA-001)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "jinja2>=3.1.4",
    "click>=8.1.7",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "prometheus-client>=0.24.1",
    "psycopg2-binary>=2.9.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
analyze-n8n = "n8n_analyzer.cli:main"

[tool.uv.workspace]
members = [
    "n8n-tuning",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
